# input.conf — горячие клавиши профиля "my"
# Всё, что здесь не указано, работает как в обычном mpv.

# --- Мышь ---
MBTN_RIGHT     script-binding hybrid/menu            # правый клик — главное меню
MBTN_LEFT_DBL  cycle fullscreen                      # двойной клик — полный экран

# --- Меню (как в uosc) ---
MENU           script-binding hybrid/menu
TAB            script-binding hybrid/menu2           # второе меню (выбирается в «Настроить меню…»)
Ctrl+E         script-binding hybrid/menu-editor     # Ctrl+Shift+E — редактор меню
Ctrl+У         script-binding hybrid/menu-editor     # то же в русской раскладке
Ctrl+o         script-binding hybrid/open-file       # открыть файл
Ctrl+v         script-binding hybrid/paste           # открыть ссылку из буфера обмена сразу
Ctrl+V         script-binding hybrid/paste-queue     # Ctrl+Shift+V — добавить ссылку в плейлист
Ctrl+м         script-binding hybrid/paste           # то же в русской раскладке
Ctrl+М         script-binding hybrid/paste-queue
Ctrl+l         script-binding hybrid/open-url        # поле ввода ссылки (буфер уже вставлен)
Ctrl+д         script-binding hybrid/open-url
Ctrl+h         script-binding hybrid/history         # недавние файлы
Alt+s          script-binding hybrid/subtitles       # субтитры
Alt+a          script-binding hybrid/audio           # аудиодорожки
Alt+p          script-binding hybrid/playlist        # плейлист
Alt+c          script-binding hybrid/chapters        # главы
Alt+d          script-binding hybrid/audio-device    # аудиоустройство
Ctrl+p         script-binding hybrid/pip             # картинка в картинке
Alt+q          script-binding hybrid/quality         # качество стрима / онлайн-видео
Alt+й          script-binding hybrid/quality         # то же в русской раскладке
Ctrl+e         script-binding hybrid/editor          # редактор оболочки
Ctrl+у         script-binding hybrid/editor          # то же в русской раскладке

# --- Перемотка и громкость ---
LEFT           seek -5
RIGHT          seek 5
# шаг громкости берётся из скина (редактор → регулятор громкости → «Шаг»), без текста «Volume: 56%»
UP             script-binding hybrid/volume-up
DOWN           script-binding hybrid/volume-down
WHEEL_UP       script-binding hybrid/volume-up       # колесо над видео — громкость
WHEEL_DOWN     script-binding hybrid/volume-down     # (над полосой перемотки — перемотка)
SPACE          cycle pause

# --- Дополнения (включаются и выключаются в меню «Ещё» → «Дополнения») ---
c              script-binding hybrid/clip-start      # клип: отметить начало
C              script-binding hybrid/clip-save       # Shift+C — сохранить клип (от начала до этого места)
с              script-binding hybrid/clip-start      # то же в русской раскладке
С              script-binding hybrid/clip-save
# заглавная русская буква может прийти и как «Shift+буква» — на всякий случай оба варианта
Shift+с        script-binding hybrid/clip-save
Shift+С        script-binding hybrid/clip-save
Ctrl+s         script-binding hybrid/shot-clipboard  # кадр в буфер обмена (Ctrl+V в Telegram/Discord)
Ctrl+ы         script-binding hybrid/shot-clipboard
Ctrl+z         script-binding hybrid/seek-undo       # отменить перемотку
Ctrl+я         script-binding hybrid/seek-undo
Ctrl+y         script-binding hybrid/seek-redo       # вернуть отменённую перемотку
Ctrl+н         script-binding hybrid/seek-redo

# --- Те же клавиши в русской раскладке ---
а              cycle fullscreen                      # f
ь              cycle mute                            # m
ы              screenshot                            # s
Ы              screenshot video                      # S — скриншот без субтитров
Shift+ы        screenshot video
Shift+Ы        screenshot video
й              quit                                  # q
Й              quit-watch-later                      # Q
Shift+й        quit-watch-later
Shift+Й        quit-watch-later
з              show-progress                         # p

# SponsorBlock — пропуск рекламных вставок в видео с YouTube
# Нужен Python (уже установлен).

# какие отрезки загружать (показываются как главы на полосе перемотки)
categories=sponsor,intro,outro,interaction,selfpromo,filler

# какие пропускать автоматически
# sponsor — реклама, selfpromo — самореклама, interaction — «подпишись/лайк»
# Пусто: SponsorBlock только размечает отрезки главами, а пропуск делает кнопка Prism справа внизу
# («Пропустить рекламу»…); режим — меню «Ещё» → «Дополнения» → «Пропуск» (кнопка / сам / выключено).
# Вернуть старое молчаливое пропускание: skip_categories=sponsor,selfpromo,interaction
skip_categories=

# пропускать каждый отрезок только один раз (если перемотал назад — не пропускать снова)
skip_once=yes

# показывать отрезки как главы
make_chapters=yes

# не отправлять статистику просмотров
report_views=no
